id: live_happy_01
description: from_live happy Свиная Стандарт+Куриная Стандарт @ Молодежной 107б (n=12)
turns:
- send: /cancel
- send: /start
  expect_contains:
  - заказ
- send: Самовывоз, Raketa на Молодежной 107б
  expect_contains:
  - Молодеж
- send: 'Свиная Стандарт и ещё: Куриная Стандарт'
  expect_not_contains:
  - один шаг
- send: К 11:30, картой, телефон 89001234567
  expect_contains:
  - Молодеж
  expect_regex: (подтверд|подтверж|верно|оформл)
  expect_not_contains:
  - один шаг
- send: да
  await_replies: 2
  expect_contains:
  - Новый заказ
  - ORD-
  - Молодеж
